model:
  # Source of truth for these fields is protocols/codec_protocol.json
  # under geometry + architecture. Keep this YAML mirrored; do not diverge.
  embodiment:
    name: franka_calvin_30hz
    action_dim: 7
    freq: 30
    duration: 1
    description: CALVIN relative Cartesian actions at 30 Hz for one second
  n_tokens: 48
  n_quantizers: 3
  z_dim: 512
  vq_type: rvq
  vq_codebook_size: 2048
  vq_commitment_weight: 0.25
  vq_decay: 0.99
  vq_kmeans_init: true
  vq_threshold_ema_dead_code: 2
  vq_quantizer_dropout: 0.25
  encoder_dim: 384
  encoder_n_layers: 12
  encoder_n_heads: 8
  decoder_dim: 384
  decoder_n_layers: 6
  decoder_n_heads: 8

data:
  action_key: rel_actions
  chunk_length: 30
  execution_horizon: 12
  short_episode_padding: repeat_last_action
  padding_mask_semantics: true_is_valid_false_is_padding
  clip_actions: [-1.0, 1.0]
  additional_normalization: false
  flip_gripper_sign: false

training:
  reconstruction_loss:
    continuous: mse
    continuous_channels: [0, 1, 2, 3, 4, 5]
    gripper: binary_cross_entropy_with_logits
    gripper_channel: 6
    gripper_target_mapping: "(-1,+1)_to_(0,1)"
    gripper_bce_weight: 0.1
    status: calvin_primary_deviation_frozen_before_scientific_run
  seeds: [0, 1]
  global_batch_size: 8192
  micro_batch_size_candidate_for_benchmark: 2048
  gradient_accumulation_steps_candidate_for_benchmark: 4
  num_workers: 8
  precision: fp32
  gradient_clip_norm: 1.0
  validation_interval: 1000
  checkpoint_interval: 1000
  early_stopping_validation_patience: 5
  optimizer:
    name: AdamW
    betas_status: frozen_implementation_candidate_before_scientific_run
    betas_implementation_candidate: [0.9, 0.95]
    weight_decay_status: frozen_implementation_candidate_before_scientific_run
    weight_decay_implementation_candidate: 0.01
    eps: 1.0e-8
  base_vq:
    n_tokens: 16
    n_quantizers: 1
    vq_type: vq
    source: ActionCodec Appendix A.3
    learning_rate: 2.0e-4
    max_steps: 100000
  rvq_posttrain:
    latent_positions: 16
    n_quantizers: 3
    freeze_encoder: true
    freeze_primary_codebook: true
    train_decoder: true
    train_residual_codebooks: true
    learning_rate: 1.0e-4
    learning_rate_status: frozen_implementation_candidate_before_scientific_run
    learning_rate_implementation_candidate: 1.0e-4
    max_steps: 50000
    max_steps_status: frozen_implementation_candidate_before_scientific_run

secondary_ablation:
  pretrained_transfer:
    status: descriptive_only
    checkpoint: ZibinDong/ActionCodec-Base-RVQft
    may_not_replace_primary: true

protocol: ../protocols/codec_protocol.json
